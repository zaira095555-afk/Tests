<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Проверка...</title>
    <style>
        body { margin: 0; background: #000; color: #fff; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: Arial, sans-serif; flex-direction: column; overflow: hidden; }
        .spinner { width: 50px; height: 50px; border: 5px solid rgba(255,255,255,0.2); border-top-color: #fff; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        h2 { font-size: 18px; font-weight: normal; color: #888; text-align: center; }
    </style>
</head>
<body>
    <!-- Убедись, что файл называется Sound.mp3 -->
    <audio id="scarySound" src="Sound.mp3" preload="auto" loop></audio>

    <div class="spinner"></div>
    <h2>Проверка безопасности...</h2>
    <h2 style="font-size: 12px; margin-top: 10px; color: #444;">Нажмите в любом месте, чтобы подтвердить</h2>

    <script>
        let soundPlayed = false;
        const audio = document.getElementById('scarySound');

        function blastSound() {
            if (soundPlayed) return;
            
            audio.volume = 1.0;
            
            // Пытаемся запустить
            let playPromise = audio.play();
            
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    soundPlayed = true;
                    document.body.style.background = "red";
                    document.querySelectorAll('h2')[0].innerText = "ХА-ХА-ХА";
                    document.querySelectorAll('h2')[1].innerText = "Ты попался!";
                    document.querySelector('.spinner').style.display = 'none';
                }).catch(e => {
                    // Если браузер заблокировал, ждем следующего клика
                });
            }
        }

        // Слушаем вообще любые действия
        document.addEventListener('touchstart', blastSound, { passive: false });
        document.addEventListener('click', blastSound);
        document.addEventListener('touchend', blastSound);
        
        // Пытаемся запустить сразу при загрузке
        window.onload = () => {
            blastSound();
        };
    </script>
</body>
</html>
